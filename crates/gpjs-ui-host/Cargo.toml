[package]
name = "gpjs-ui-host"
description = "Runtime binary for gpjs-ui apps — reads a prebuilt, self-contained JS bundle and mounts it through the real gpjs-ui/GPUI stack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
publish = false

[dependencies]
env_logger.workspace = true
gpjs-ui = { path = "../gpjs-ui" }
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# font-kit is required on macOS (gpui_macos) for any text to render at all —
# without it, gpui_macos silently draws every other primitive but skips text.
gpui_platform = { workspace = true, features = ["font-kit"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true
