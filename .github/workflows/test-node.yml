# Called once per Node.js version from ci.yml's `test-node-*` jobs.

name: Test (Node)

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string

permissions: {}

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # Build on 26, test on the given version: older Node as a consumer, not as tooling.
      - name: Set node version to 26 for install and build
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Set node version to ${{ inputs.node_version }}
        if: inputs.node_version != '26'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Test
        run: pnpm exec vitest run
