# docs/TESTING.md is the source of truth for what must pass; this only runs it.

name: CI

permissions: {}

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - release/*
      - hotfix/*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gates the jobs below. Filtering with `on: paths:` instead would leave a
  # required status check unreported, blocking the pull request forever.
  changed:
    name: Detect changed areas
    timeout-minutes: 5
    runs-on: ubuntu-latest
    # The filter reads the event's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              # cargo test evaluates this package's build output
              - 'packages/gpjs-ui/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/test-rust.yml'
            js:
              - 'packages/**'
              - 'examples/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'oxlint.config.ts'
              - 'oxfmt.config.mts'
              - '.github/workflows/ci.yml'
              - '.github/workflows/test-node.yml'

  lint:
    name: "Lint: node-26, ubuntu-latest"
    needs: changed
    if: needs.changed.outputs.js == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node version to 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Root scripts, so examples/ is covered too — it defines no `pretest`.
      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format

      - name: Typecheck
        run: pnpm run typecheck

  # One caller job per version — a matrix job's skip doesn't expand per matrix value.
  test-node-20:
    name: "Build&Test: node-20, ubuntu-latest"
    needs: changed
    if: needs.changed.outputs.js == 'true'
    uses: ./.github/workflows/test-node.yml
    with:
      node_version: "20"

  test-node-22:
    name: "Build&Test: node-22, ubuntu-latest"
    needs: changed
    if: needs.changed.outputs.js == 'true'
    uses: ./.github/workflows/test-node.yml
    with:
      node_version: "22"

  test-node-24:
    name: "Build&Test: node-24, ubuntu-latest"
    needs: changed
    if: needs.changed.outputs.js == 'true'
    uses: ./.github/workflows/test-node.yml
    with:
      node_version: "24"

  test-node-26:
    name: "Build&Test: node-26, ubuntu-latest"
    needs: changed
    if: needs.changed.outputs.js == 'true'
    uses: ./.github/workflows/test-node.yml
    with:
      node_version: "26"

  # gpui_platform's features differ per platform, so both need checking.
  rust-ubuntu-latest:
    name: "Rust: ubuntu-latest"
    needs: changed
    if: needs.changed.outputs.rust == 'true'
    uses: ./.github/workflows/test-rust.yml
    with:
      os: ubuntu-latest

  rust-macos-latest:
    name: "Rust: macos-latest"
    needs: changed
    if: needs.changed.outputs.rust == 'true'
    uses: ./.github/workflows/test-rust.yml
    with:
      os: macos-latest

  # One status check whose name survives changes to the jobs above.
  passed:
    name: CI Passed
    if: always()
    needs:
      [
        changed,
        lint,
        test-node-20,
        test-node-22,
        test-node-24,
        test-node-26,
        rust-ubuntu-latest,
        rust-macos-latest,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
