# Called once per OS from ci.yml's `rust-*` jobs.

name: Test (Rust)

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions: {}

jobs:
  test:
    timeout-minutes: 30
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # .devcontainer/Dockerfile's list, minus the display-only packages.
      - name: Install gpui's native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            clang \
            lld \
            llvm \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libssl-dev

      - name: Install clippy and rustfmt
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node version to 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # tests/js_core_integration.rs reads this package's dist/ off disk.
      - name: Build the gpjs-ui package
        run: pnpm --filter gpjs-ui build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
