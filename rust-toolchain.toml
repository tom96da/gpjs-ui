# Pinned so the ubuntu and macos CI legs don't compile with the different
# rustc versions their runner images happen to ship. Cargo.toml's
# rust-version is held equal to this channel -- bump both together.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
