#:schema https://json.schemastore.org/cargo.json

# Copyright (c) 2026 tom96da
# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "3"
members = [
  "crates/gpjs-ui",
  "crates/gpjs-ui-example-runner",
  # gpjs-ui-example-runner becomes gpjs-ui-host in Phase 3.1; gpjs-ui-macros
  # lands on-demand — see docs/ROADMAP.md
]
default-members = ["crates/gpjs-ui"]

[workspace.package]
version = "0.0.0-0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["tom96da"]
repository = "https://github.com/tom96da/gpjs-ui"
readme = "README.md"
keywords = ["gpui", "quickjs", "desktop-app", "gui", "webview-free"]

[workspace.dependencies]
env_logger = "0.11"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.17.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.17.2" }
rquickjs = { version = "0.12.2", default-features = false, features = ["std"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
unreadable_literal = "allow"
